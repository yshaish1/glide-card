<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Glide Card Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        /* HA's named colors (subset) */
        --red-color:#f44336; --pink-color:#e91e63; --purple-color:#926bc7; --indigo-color:#3f51b5; --blue-color:#2196f3;
        --light-blue-color:#03a9f4; --cyan-color:#00bcd4; --teal-color:#009688; --green-color:#4caf50; --light-green-color:#8bc34a;
        --lime-color:#cddc39; --yellow-color:#ffeb3b; --amber-color:#ffc107; --orange-color:#ff9800; --deep-orange-color:#ff6f22;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: #eee;
        background: #0f0e13; transition: background .4s;
      }
      .bar {
        position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px;
        background: rgba(20,20,24,.85); backdrop-filter: blur(12px); color: #eee; font-size: 13px; align-items: center;
      }
      .bar label { display: flex; gap: 6px; align-items: center; }
      .bar select, .bar button { font: inherit; background: #2a2a30; color: #eee; border: 1px solid #444; border-radius: 8px; padding: 4px 8px; }
      .stage { margin: 24px auto 140px; padding: 0 16px; transition: max-width .3s; }
      .stage[data-w="phone"] { max-width: 420px; }
      .stage[data-w="tablet"] { max-width: 860px; }
      .stage[data-w="desktop"] { max-width: 1200px; }
      h1 { font-size: 32px; margin: 8px 0 16px; }
      /* Mimics HA sections view: 12 columns, 56px rows, 8px gap */
      .grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(56px, auto); gap: 8px; }
      .grid > * { grid-column: span var(--cols, 6); grid-row: span var(--rows, 2); min-width: 0; }
      body[data-bg$="-light"] { color: #222; }
    </style>
  </head>
  <body data-bg="glass-dark">
    <div class="bar">
      <strong>Glide Card</strong>
      <label>Theme <select id="theme"></select></label>
      <label>Mode <select id="mode"><option value="dark">Dark</option><option value="light">Light</option></select></label>
      <label>Language <select id="lang"><option value="en">English (LTR)</option><option value="he">עברית (RTL)</option></select></label>
      <label>Tap <select id="tap"></select></label>
      <label>Size <select id="size"><option value="full">Full</option><option value="compact">Compact</option><option value="slim">Slim</option></select></label>
      <label>Background <select id="backdrop"></select></label>
      <label>Sun <select id="sun"><option value="above_horizon">Day</option><option value="below_horizon">Night</option></select></label>
      <label>Width <select id="width"><option value="phone">Phone</option><option value="tablet">Tablet</option><option value="desktop">Desktop</option></select></label>
    </div>
    <div class="stage" data-w="phone">
      <h1 id="title">Living Room</h1>
      <div class="grid" id="grid"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
